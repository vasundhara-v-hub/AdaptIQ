<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | AdaptIQ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-brand">
                <div class="auth-logo">A</div>

                <div>
                    <h1>AdaptIQ</h1>
                    <p>AI Personalized Learning</p>
                </div>
            </div>

            <div class="auth-heading">
                <h2>Create your student account</h2>
                <p>Start your personalized learning journey.</p>
            </div>

            <form id="register-form">

                <div class="auth-input-group">
                    <label for="register-name">Full Name</label>
                    <input
                        type="text"
                        id="register-name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="auth-input-group">
                    <label for="register-email">Email</label>
                    <input
                        type="email"
                        id="register-email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="auth-input-group">
                    <label for="register-password">Password</label>
                    <input
                        type="password"
                        id="register-password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <div class="auth-input-group">
                    <label for="register-goal">Learning Goal</label>
                    <input
                        type="text"
                        id="register-goal"
                        placeholder="Example: Improve my programming skills"
                        required
                    >
                </div>

                <div class="auth-input-group">
                    <label for="register-subjects">
                        Subjects
                    </label>

                    <input
                        type="text"
                        id="register-subjects"
                        placeholder="Example: Python, AI, Machine Learning"
                        required
                    >

                    <small>
                        Separate multiple subjects with commas.
                    </small>
                </div>

                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account
                </button>

                <p
                    id="register-message"
                    class="auth-message"
                ></p>

            </form>

            <div class="auth-footer">
                <p>
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>
            </div>

        </section>

    </main>

    <script>
const API_URL = "http://127.0.0.1:8000";

        const registerForm =
            document.getElementById("register-form");

        registerForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const name =
                document.getElementById("register-name").value.trim();

            const email =
                document.getElementById("register-email").value.trim();

            const password =
                document.getElementById("register-password").value;

            const goal =
                document.getElementById("register-goal").value.trim();

            const subjectsInput =
                document.getElementById("register-subjects").value.trim();

            const message =
                document.getElementById("register-message");

            const subjects =
                subjectsInput
                    .split(",")
                    .map(subject => subject.trim())
                    .filter(subject => subject !== "");

            message.textContent = "Creating your account...";
            message.className = "auth-message";

            try {

                const response = await fetch(
                    `${API_URL}/register`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            name: name,
                            email: email,
                            password: password,
                            goal: goal,
                            subjects: subjects
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "Registration failed."
                    );
                }

                message.textContent =
                    "Account created successfully! Redirecting to login...";

                message.className =
                    "auth-message success";

                setTimeout(function() {
                    window.location.href = "login.html";
                }, 1200);

            } catch (error) {

                console.error(error);

                message.textContent =
                    error.message ||
                    "Unable to connect to the backend.";

                message.className =
                    "auth-message error";
            }

        });

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AdaptIQ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-card">

            <!-- BRAND -->
            <div class="auth-brand">

                <div class="auth-logo">
                    A
                </div>

                <div>
                    <h1>AdaptIQ</h1>
                    <p>AI Personalized Learning</p>
                </div>

            </div>


            <!-- HEADING -->
            <div class="auth-heading">

                <h2>Welcome back</h2>

                <p>
                    Login to continue your personalized learning journey.
                </p>

            </div>


            <!-- LOGIN FORM -->
            <form id="login-form">

                <div class="auth-input-group">

                    <label for="login-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="auth-input-group">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                    id="login-btn"
                >
                    Login
                </button>


                <p
                    id="login-message"
                    class="auth-message"
                ></p>

            </form>


            <!-- FOOTER -->
            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">Create an account</a>
                </p>

            </div>

        </section>

    </main>


    <script>

        const API_URL = "http://127.0.0.1:8000";

        const loginForm =
            document.getElementById("login-form");

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email =
                    document
                        .getElementById("login-email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("login-password")
                        .value;

                const message =
                    document.getElementById(
                        "login-message"
                    );

                const loginButton =
                    document.getElementById(
                        "login-btn"
                    );


                message.textContent =
                    "Logging you in...";

                message.className =
                    "auth-message";

                loginButton.disabled = true;

                try {

                    const response =
                        await fetch(
                            `${API_URL}/login`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();
                        console.log("LOGIN RESPONSE:", data);
console.log("ACCESS TOKEN:", data.access_token);


                    if (!response.ok) {

                        throw new Error(
                            data.detail ||
                            "Invalid email or password."
                        );

                    }
console.log("LOGIN RESPONSE:", data);
console.log("ACCESS TOKEN:", data.access_token);

                    /*
                     * Save authentication information
                     * in the browser.
                     */

                    localStorage.setItem(
                        "adaptiq_token",
                        data.access_token
                    );
                    console.log(
    "SAVED TOKEN:",
    localStorage.getItem("adaptiq_token")
);

                    localStorage.setItem(
                        "adaptiq_user_id",
                        data.user_id
                    );

                    localStorage.setItem(
                        "adaptiq_user_name",
                        data.name
                    );

                    localStorage.setItem(
                        "adaptiq_user_email",
                        data.email
                    );


                    message.textContent =
                        "Login successful! Opening your dashboard...";

                    message.className =
                        "auth-message success";


                    setTimeout(function() {

                        window.location.href =
                            "index.html";

                    }, 1000);


                } catch (error) {

                    console.error(error);

                    message.textContent =
                        error.message ||
                        "Unable to connect to the backend.";

                    message.className =
                        "auth-message error";

                } finally {

                    loginButton.disabled = false;

                }

            });

    </script>

</body>

</html>
